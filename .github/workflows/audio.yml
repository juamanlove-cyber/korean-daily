name: make-audio
on:
  push:
    branches: [main]
    paths: ["audio/list.tsv", "tools/make_audio.py"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts==7.0.2
      - run: python -u tools/make_audio.py
        timeout-minutes: 25
      - name: Commit audio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Add generated audio" && git push)
      - name: Rebuild Pages
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
